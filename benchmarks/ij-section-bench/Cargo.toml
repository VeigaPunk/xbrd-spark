[package]
name = "ij-section-bench"
version = "0.1.0"
edition = "2021"
description = "IJ-protocol serial baton sectioning benchmark for sekhmet (legal PD corpus only)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "ij-section-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", default-features = true }
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
